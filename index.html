
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    header {
      background: #123b70;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 420px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #00000010;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1769d2;
      color: white;
      font-size: 16px;
    }

    #message {
      text-align: center;
      color: #1769d2;
    }
  </style>
</head>

<body>
  <header>
    <h1>My Website</h1>
    <p>Welcome to your dashboard</p>
  </header>

  <main>
    <div class="card">
      <h2>Login</h2>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter password"
          required
        >

        <button type="submit">Continue</button>
      </form>

      <p id="message"></p>
    </div>
  </main>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          " only: connect a secure backend to enable login.";
      });
  </script>
</body>
</html>
